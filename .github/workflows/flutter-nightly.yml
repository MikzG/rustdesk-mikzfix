name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      all-platforms:
        description: "Also build macOS / Linux / Android (~60min instead of ~20min)"
        type: boolean
        default: false

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      # Scheduled runs stay Windows-only; tick the box on a manual run to get everything.
      all-platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.all-platforms || false }}
